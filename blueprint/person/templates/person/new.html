{% extends 'base.html' %}

{% block page_title %}
    Create New Person | Person App
{% endblock page_title %}
    
{% block main_content %}
    <h1>Create New Person</h1>
   <form action="{{ url_for("person.create") }}" method="POST">
        <input type="text" name="name" placeholder="Name of person"><br><br>
        <input type="number" name="age" placeholder="Age of person"><br><br>
        <input type="text" name="job" placeholder="Person's Occupation"><br><br>
        <button type="submit">Submit</button>
   </form>
{% endblock main_content %}
